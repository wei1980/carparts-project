name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22.x'

jobs:
  lint-and-test-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./carparts-api
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: carparts-api/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter (if configured)
        run: npm run lint 2>/dev/null || echo "No lint script defined"
      
      - name: Run tests with coverage
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/carparts_test
          JWT_SECRET: test-secret-key-for-ci
          NODE_ENV: test
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          directory: ./carparts-api/coverage
          flags: api
          fail_ci_if_error: false

  lint-and-test-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./carparts-web
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: carparts-web/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint
      
      - name: Run tests with coverage
        run: npm test
      
      - name: Build production
        run: npm run build
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          directory: ./carparts-web/coverage
          flags: web
          fail_ci_if_error: false

  build-check:
    needs: [lint-and-test-api, lint-and-test-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify all builds pass
        run: echo "All checks passed ✅"